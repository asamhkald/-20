  if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();

}

async function sha256Hex(text) {
  const enc = new TextEncoder().encode(String(text));

// Exact BigInt Minor-Unit Arithmetic
function toMinor(val) {
  const s = String(val == null ? "0" : val).trim();
  const m = /^([+-]?)(\d+)(?:\.(\d+))?$/.exec(s);
  if (!m) return 0n;
  const sign = m[1] === "-" ? -1n : 1n;
  const whole = BigInt(m[2]);
  const frac = BigInt((m[3] || "").padEnd(2, "0").slice(0, 2));
  return sign * (whole * 100n + frac);
}
function fromMinor(minor) {
  const neg = minor < 0n;
  const abs = neg ? -minor : minor;
  const whole = abs / 100n;
  const frac = Number(abs % 100n);
  const num = Number(whole) + frac / 100;
  return neg ? -num : num;
}
function fmtMinor(minor) {
  const neg = minor < 0n;
  const abs = neg ? -minor : minor;
  const whole = (abs / 100n).toLocaleString("en-US");
  const frac = abs % 100n;
  return `${neg ? "-" : ""}${whole}${frac > 0n ? "." + frac.toString().padStart(2, "0") : ""}`;
}

// Safe arithmetic expression parser (NO eval)
function safeCalcExpression(expr) {
  const cleaned = normalizeArabicDigits(String(expr || "")).replace(/\s+/g, "");
  if (!/^[0-9+\-*/().]+$/.test(cleaned)) return null;
  try {
    const tokens = cleaned.match(/\d+(?:\.\d+)?|[+\-*/()]/g);
    if (!tokens) return null;
    let pos = 0;
    function parseExpr() {
      let left = parseTerm();
      while (tokens[pos] === "+" || tokens[pos] === "-") {
        const op = tokens[pos++];
        const right = parseTerm();
        left = op === "+" ? left + right : left - right;
      }
      return left;
    }
    function parseTerm() {
      let left = parseFactor();
      while (tokens[pos] === "*" || tokens[pos] === "/") {
        const op = tokens[pos++];
        const right = parseFactor();
        if (op === "/" && right === 0) throw new Error("Div0");
        left = op === "*" ? left * right : left / right;
      }
      return left;
    }
    function parseFactor() {
      const t = tokens[pos++];
      if (t === "(") { const v = parseExpr(); if (tokens[pos++] !== ")") throw new Error("Paren"); return v; }
      if (t === "-") return -parseFactor();
      const n = Number(t);
      if (!Number.isFinite(n)) throw new Error("NaN");
      return n;
    }
    const res = parseExpr();
    if (pos !== tokens.length || !Number.isFinite(res)) return null;
    return Number(res.toFixed(2));
  } catch (_) { return null; }
}

function normalizeArabicDigits(str) {
  const map = { "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9","۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9" };
  return String(str || "").replace(/[٠-٩۰-۹]/g, c => map[c] || c);
}
function parseArabicVoiceWordsToNumbers(text) {
  let s = normalizeArabicDigits(text).trim();
  const wordNums = [
    [/\bمليونين\b/g, "2000000"], [/\bمليون\b/g, "1000000"],
    [/\bعشرة\s*آلاف\b|\bعشر\s*الاف\b/g, "10000"], [/\bخمسة\s*آلاف\b|\bخمس\s*الاف\b/g, "5000"],
    [/\bألفين\b|\bالفين\b/g, "2000"], [/\bألف\b|\bالف\b/g, "1000"],
    [/\bخمسمئة\b|\bخمسمية\b/g, "500"], [/\bمئتين\b|\bميتين\b/g, "200"], [/\bمئة\b|\bمية\b/g, "100"],
    [/\bخمسين\b/g, "50"], [/\bعشرين\b/g, "20"], [/\bعشرة\b/g, "10"], [/\bخمسة\b/g, "5"],
    [/\bنصف\b|\bنص\b/g, "0.5"]
  ];
  for (const [re, rep] of wordNums) s = s.replace(re, rep);
  return s;
}
function parseArabicFinancialCommand(rawInput) {
  const text = parseArabicVoiceWordsToNumbers(rawInput);
  if (!text) return null;
  const mathVal = safeCalcExpression(text);
  if (mathVal !== null && /[+\-*/]/.test(text)) return { kind: "calc", result: mathVal, raw: text };

  let tx_type = "income";
  if (/(صرف|صرفت|دفع|دفعت|مصروف|شراء|اشتريت|كهرباء|إيجار|ايجار|رواتب|تالف|مرتجع)/.test(text)) tx_type = "expense";
  else if (/(دين\s*على|آجل|اجل|سجل\s*دين|لصالحنا\s*على|بعت\s*بالدين)/.test(text)) tx_type = "debt_out";
  else if (/(دين\s*علينا|دفعة\s*مورد|للمورد|استلمت\s*بضاعة\s*بالدين)/.test(text)) tx_type = "debt_in";
  else if (/(قبض|قبضت|استلمت|بيع|بعت|مبيعات|تحصيل|دخل)/.test(text)) tx_type = "income";

  let currency = "USD";
  if (/(ليرة|ل\.س|سوري|syp|ليره)/i.test(text)) currency = "SYP";
  else if (/(دولار|\$|usd|امريكي)/i.test(text)) currency = "USD";

  const qtyPrice = text.match(/(\d+(?:\.\d+)?)\s*(?:×|\*|قطع|حبات|شواحن|أجهزة|اجهزة)?\s*(?:بسعر|سعر|بـ|ب)\s*(\d+(?:\.\d+)?)/);
  let amount = 0;
  if (qtyPrice) amount = Number(qtyPrice[1]) * Number(qtyPrice[2]);
  else {
    const nums = text.match(/\d+(?:\.\d+)?/g);
    if (nums && nums.length > 0) amount = Math.max(...nums.map(Number));
  }
  let matchedAcc = null;
  for (const a of state.accounts) { if (a.name && text.includes(a.name)) { matchedAcc = a; break; } }
  return { kind: "tx", tx_type, amount, currency, account_id: matchedAcc ? matchedAcc.id : null, account_name: matchedAcc ? matchedAcc.name : "", description: rawInput.trim() };
}

let toastTimer = null;
function showToast(msg, type = "success") {
  const box = document.getElementById("toast-box");
  const bg = type === "error" ? "#7f1d1d" : type === "info" ? "#1e3a8a" : "#065f46";
  box.innerHTML = `<div class="toast" style="background:${bg};color:#fff;border:1px solid rgba(255,255,255,.2)">${escapeHtml(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.innerHTML = ""; }, 3500);
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmtDate(iso) {
  if (!iso) return "—";
  try { const d = new Date(iso); return d.toLocaleDateString("ar-EG",{year:"numeric",month:"short",day:"numeric"})+" "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}); } catch (_) { return iso; }
}
function fmtShortDate(iso) { try { return new Date(iso || Date.now()).toLocaleDateString("en-CA"); } catch (_) { return "—"; } }
function openWhatsApp(phone, text) {
  let p = String(phone || "").replace(/[^\d+]/g, "");
  if (p.startsWith("+")) p = p.slice(1);
  if (p.startsWith("09") && p.length === 10) p = "963" + p.slice(1);
  else if (p.startsWith("00")) p = p.slice(2);
  window.open(p ? `https://wa.me/${p}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); showToast("تم النسخ بنجاح"); } catch (_) { showToast("تعذّر النسخ", "error"); } }

async function importFullBackup(file) {
  if (!file || !perms().canBackup) return;
  try {
    const parsed = JSON.parse(await file.text());
    if (!parsed.sha256 || !parsed.bundle) throw new Error("صيغة الملف غير صالحة");
    if (await sha256Hex(JSON.stringify(parsed.bundle)) !== parsed.sha256) throw new Error("فشل التحقق من بصمة SHA-256 — الملف معدّل أو تالف!");
    Object.entries(parsed.bundle.modules || {}).forEach(([k, v]) => saveModuleData(k, v));
    if (parsed.bundle.exchangeRate) { state.exchangeRate = Number(parsed.bundle.exchangeRate); localStorage.setItem(RATE_KEY, String(state.exchangeRate)); }
    recordLocalAudit("BACKUP_RESTORE", "system", null, { sha256: parsed.sha256.slice(0, 12) });
    showToast("تم التحقق الأمني واستعادة كافة البيانات بنجاح ✅"); render();
  } catch (err) { showToast("فشل الاستعادة: " + err.message, "error"); }
}

// =========================================================================
// 6. IFRS ENGINE, DOUBLE-ENTRY TRIAL BALANCE, DEBT AGING & AUTOMATED AUDIT
// =========================================================================
function computeFinancials() {
  const reversedIds = new Set(state.transactions.filter(t => t.tx_type === "reversal" && t.reversed_tx_id).map(t => t.reversed_tx_id));
  let usdCash = 0n, sypCash = 0n, usdRec = 0n, sypRec = 0n, usdPay = 0n, sypPay = 0n;
  let usdRev = 0n, sypRev = 0n, usdExp = 0n, sypExp = 0n;
  let usdInToday = 0n, usdOutToday = 0n, sypInToday = 0n, sypOutToday = 0n;
  const todayStr = fmtShortDate();
  const accountBalances = {};
  const openDebtEntries = [];

  for (const t of state.transactions) {
    if (t.tx_type === "reversal" || reversedIds.has(t.id)) continue;
    const amt = toMinor(t.amount);
    const cur = t.currency;
    const accId = t.account_id;
    const isToday = fmtShortDate(t.created_at) === todayStr;
    if (accId && !accountBalances[accId]) accountBalances[accId] = { USD: 0n, SYP: 0n };

    if (t.tx_type === "income") {
      if (cur === "USD") { usdCash += amt; if (t.module_source !== "fx_exchange") usdRev += amt; if (isToday) usdInToday += amt; }
      else { sypCash += amt; if (t.module_source !== "fx_exchange") sypRev += amt; if (isToday) sypInToday += amt; }
    } else if (t.tx_type === "expense") {
      if (cur === "USD") { usdCash -= amt; if (t.module_source !== "fx_exchange") usdExp += amt; if (isToday) usdOutToday += amt; }
      else { sypCash -= amt; if (t.module_source !== "fx_exchange") sypExp += amt; if (isToday) sypOutToday += amt; }
    } else if (t.tx_type === "debt_out") {
      if (cur === "USD") { usdRec += amt; usdRev += amt; } else { sypRec += amt; sypRev += amt; }
      if (accId) accountBalances[accId][cur] += amt;
      openDebtEntries.push({ id: t.id, accId, amt, cur, created_at: t.created_at, desc: t.description });
    } else if (t.tx_type === "debt_in") {
      if (cur === "USD") usdPay += amt; else sypPay += amt;
      if (accId) accountBalances[accId][cur] -= amt;
    }
  }

  // COGS & FX Gain/Loss from specialized ledgers
  const cogsEntries = loadModuleData("cogs_ledger", []);
  let usdCogs = 0n, sypCogs = 0n;
  for (const c of cogsEntries) {
    if (c.currency === "USD") usdCogs += toMinor(c.cost);
    else sypCogs += toMinor(c.cost);
  }
  const fxEntries = loadModuleData("fx_history", []);
  let fxGainUsd = 0n, fxGainSyp = 0n;
  for (const f of fxEntries) {
    if (f.toCurrency === "USD") fxGainUsd += toMinor(f.gainLoss || 0);
    else fxGainSyp += toMinor(f.gainLoss || 0);
  }

  // Inventory Valuation at Cost (Asset for Balance Sheet)
  const items = loadModuleData("pos_items", []);
  let invValUsd = 0n, invValSyp = 0n;
  for (const it of items) {
    const val = toMinor(it.cost || 0) * BigInt(Math.max(0, Number(it.stock || 0)));
    if (it.currency === "USD") invValUsd += val; else invValSyp += val;
  }

  // IFRS Income Statements (USD & SYP)
  const pnlUsd = { revenue: usdRev, cogs: usdCogs, gross: usdRev - usdCogs, expenses: usdExp, fx: fxGainUsd, net: (usdRev - usdCogs) - usdExp + fxGainUsd };
  const pnlSyp = { revenue: sypRev, cogs: sypCogs, gross: sypRev - sypCogs, expenses: sypExp, fx: fxGainSyp, net: (sypRev - sypCogs) - sypExp + fxGainSyp };

  // Debt Aging Buckets (USD & SYP)
  const nowMs = Date.now();
  const aging = {
    USD: { b30: 0n, b60: 0n, b90: 0n, bOver: 0n, list: [] },
    SYP: { b30: 0n, b60: 0n, b90: 0n, bOver: 0n, list: [] }
  };
  for (const d of openDebtEntries) {
    if (!aging[d.cur]) continue;
    const accBal = d.accId && accountBalances[d.accId] ? accountBalances[d.accId][d.cur] : d.amt;
    if (accBal <= 0n) continue;
    const ageDays = Math.max(0, Math.floor((nowMs - new Date(d.created_at).getTime()) / 86400000));
    if (ageDays <= 30) aging[d.cur].b30 += d.amt;
    else if (ageDays <= 60) aging[d.cur].b60 += d.amt;
    else if (ageDays <= 90) aging[d.cur].b90 += d.amt;
    else aging[d.cur].bOver += d.amt;
    if (ageDays > 30) aging[d.cur].list.push({ ...d, ageDays });
  }

  // Double-Entry Trial Balance per Currency (every transaction posts equal debit & credit)
  function buildTB(cur) {
    let cashDr = 0n, cashCr = 0n, recDr = 0n, recCr = 0n, revCr = 0n, expDr = 0n, payCr = 0n;
    for (const t of state.transactions) {
      if (t.currency !== cur || t.tx_type === "reversal" || reversedIds.has(t.id)) continue;
      const a = toMinor(t.amount);
      if (t.tx_type === "income") { cashDr += a; revCr += a; }
      else if (t.tx_type === "expense") { expDr += a; cashCr += a; }
      else if (t.tx_type === "debt_out") { recDr += a; revCr += a; }
      else if (t.tx_type === "debt_in") { expDr += a; payCr += a; }
    }
    const rows = [
      { code: "1010", name: "الصندوق النقدي", dr: cashDr, cr: cashCr },
      { code: "1200", name: "الذمم المدينة (ديون لنا)", dr: recDr, cr: recCr },
      { code: "2100", name: "الذمم الدائنة (ديون علينا)", dr: 0n, cr: payCr },
      { code: "4000", name: "الإيرادات والمبيعات", dr: 0n, cr: revCr },
      { code: "5000", name: "المصروفات والتكاليف", dr: expDr, cr: 0n }
    ];
    const totalDr = rows.reduce((s, r) => s + r.dr, 0n);
    const totalCr = rows.reduce((s, r) => s + r.cr, 0n);
    return { rows, totalDr, totalCr, balanced: totalDr === totalCr };
  }
  const tbUsd = buildTB("USD");
  const tbSyp = buildTB("SYP");

  // Automated Financial Audit Checks (6 checks)
  const auditChecks = [];
  auditChecks.push({
    name: "توازن ميزان المراجعة (القيد المزدوج USD & SYP)",
    pass: tbUsd.balanced && tbSyp.balanced,
    detail: `USD: مدين ${fmtMinor(tbUsd.totalDr)} = دائن ${fmtMinor(tbUsd.totalCr)} | SYP: مدين ${fmtMinor(tbSyp.totalDr)} = دائن ${fmtMinor(tbSyp.totalCr)}`
  });
  // Double-reversal check
  const revCounts = {};
  let doubleRev = false;
  for (const t of state.transactions) {
    if (t.tx_type === "reversal" && t.reversed_tx_id) {
      revCounts[t.reversed_tx_id] = (revCounts[t.reversed_tx_id] || 0) + 1;
      if (revCounts[t.reversed_tx_id] > 1) doubleRev = true;
    }
  }
  auditChecks.push({ name: "منع القيد العكسي المزدوج (IFRS Immutability)", pass: !doubleRev, detail: doubleRev ? "تم رصد قيد معكوس أكثر من مرة!" : "لا توجد قيود عكسية مكررة" });
  auditChecks.push({ name: "عدم وجود رصيد صندوق سالب", pass: usdCash >= 0n && sypCash >= 0n, detail: `USD: ${fmtMinor(usdCash)}$ | SYP: ${fmtMinor(sypCash)} ل.س` });
  const negStock = items.filter(i => Number(i.stock) < 0);
  auditChecks.push({ name: "سلامة كميات المخزون (لا يوجد مخزون سالب)", pass: negStock.length === 0, detail: negStock.length ? `${negStock.length} صنف بكمية سالبة` : `${items.length} صنف سليم برقم UUID مخفي` });
  const seenUids = new Set(); let dupUid = false;
  for (const it of items) { const u = it.hidden_uuid || it.id; if (seenUids.has(u)) dupUid = true; seenUids.add(u); }
  auditChecks.push({ name: "تفرّد أرقام UUID المخفية للمخزون", pass: !dupUid, detail: dupUid ? "تعارض في رقم UUID!" : "جميع الأصناف بمعرّفات فريدة" });
  auditChecks.push({ name: "طابور المزامنة السحابية (Offline Queue)", pass: state.offlineQueue.length === 0, detail: state.offlineQueue.length ? `${state.offlineQueue.length} عملية بانتظار الإنترنت` : "متزامن 100% مع السحابة" });

  const passedCount = auditChecks.filter(c => c.pass).length;
  const healthScore = Math.round((passedCount / auditChecks.length) * 100);
  const alerts = auditChecks.filter(c => !c.pass).map(c => `⚠️ ${c.name}: ${c.detail}`);
  const lowStock = items.filter(i => Number(i.stock) <= Number(i.minStock || 2));
  if (lowStock.length > 0) alerts.push(`📦 تنبيه مخزون: ${lowStock.length} صنف وصل للحد الأدنى.`);
  if (alerts.length === 0) alerts.push("✅ جميع الاختبارات المالية الآلية (6/6) ناجحة 100% والصناديق متوازنة.");

  const totalUsdEquiv = fromMinor(usdCash) + (state.exchangeRate > 0 ? fromMinor(sypCash) / state.exchangeRate : 0);

  return {
    usdCash, sypCash, usdRec, sypRec, usdPay, sypPay,
    usdInToday, usdOutToday, sypInToday, sypOutToday,

async function postTransaction(payload) {
  const hiddenUuid = payload.hidden_uuid || generateHiddenUuid();
  if (state.committedUuids.has(hiddenUuid)) { showToast("تم منع التكرار تلقائياً (UUID Guard)", "info"); return false; }
  state.committedUuids.add(hiddenUuid);
  const cleanAmt = fromMinor(toMinor(payload.amount));
  if (cleanAmt <= 0) { state.committedUuids.delete(hiddenUuid); showToast("المبلغ يجب أن يكون أكبر من صفر", "error"); return false; }

  const hiddenTag = `[UID:${hiddenUuid.slice(0,8).toUpperCase()}|BY:${currentRoleKey().toUpperCase()}]`;
  const finalDesc = `${(payload.description || "").trim()} ${hiddenTag}`.trim();
  const txRecord = {
    tenant_id: state.tenant.id, account_id: payload.account_id || null, module_source: payload.module_source || "core",
    tx_type: payload.tx_type, amount: cleanAmt, currency: payload.currency,
    exchange_rate: Number(payload.exchange_rate || state.exchangeRate || 1),
    description: finalDesc, reversed_tx_id: payload.reversed_tx_id || null, created_by: state.user.id
  };

  recordLocalAudit("POST_TX", "transactions", null, { tx_type: txRecord.tx_type, amount: cleanAmt, currency: txRecord.currency, hiddenUuid });

  if (state.isDemo) {
    state.transactions.unshift({ ...txRecord, id: hiddenUuid, hidden_uuid: hiddenUuid, created_at: new Date().toISOString() });
    showToast("تم تسجيل القيد بدقة BigInt ورقم UUID مخفي ✅"); render(); return true;
  }
  if (!navigator.onLine) {
    const ltx = { ...txRecord, id: "offline-" + hiddenUuid, hidden_uuid: hiddenUuid, created_at: new Date().toISOString(), _offline: true };
    state.transactions.unshift(ltx); state.offlineQueue.push({ kind: "transaction", data: txRecord, hiddenUuid });
    saveOfflineQueue(); cacheTenantSnapshot(); showToast("حُفظ محلياً وسيُزامن تلقائياً", "info"); render(); return true;
  }
  try {
    const { data, error } = await sb.from("transactions").insert([txRecord]).select().single();
    if (error) throw error;
    state.transactions.unshift({ ...data, hidden_uuid: hiddenUuid }); cacheTenantSnapshot();
    showToast("تم تسجيل القيد ومزامنته سحابياً ✅"); render(); return true;
  } catch (err) {
    const ltx = { ...txRecord, id: "offline-" + hiddenUuid, hidden_uuid: hiddenUuid, created_at: new Date().toISOString(), _offline: true };
    state.transactions.unshift(ltx); state.offlineQueue.push({ kind: "transaction", data: txRecord, hiddenUuid });
    saveOfflineQueue(); cacheTenantSnapshot(); showToast("حُفظ في طابور المزامنة: " + err.message, "info"); render(); return true;
  }
}

async function syncOfflineQueue() {
  if (state.isDemo || !navigator.onLine || state.offlineQueue.length === 0) return;
  let synced = 0; const rem = [];
  for (const item of state.offlineQueue) {
    try {
      const { error } = await sb.from(item.kind === "account" ? "accounts" : "transactions").insert([item.data]);
      if (error) throw error; synced++;
    } catch (_) { rem.push(item); }
  }
  state.offlineQueue = rem; saveOfflineQueue();
  if (synced > 0) { showToast(`تمت مزامنة ${synced} عملية مع السحابة`); if (state.tenant) await fetchTenantData(state.tenant.id); render(); }
}

// IAS 21 Currency Exchange Conversion (USD <-> SYP)
async function submitFxConversion(e) {
  e.preventDefault();
  if (!perms().canManageFx) return showToast("لا تملك صلاحية تحويل العملات", "error");
  const dir = document.getElementById("fx-dir").value;
  const amt = fromMinor(toMinor(document.getElementById("fx-amt").value));
  const rate = Number(document.getElementById("fx-rate").value);
  const note = document.getElementById("fx-note").value.trim();
  if (amt <= 0 || rate <= 0) return showToast("أدخل مبلغاً وسعر صرف صحيحين", "error");

  const refRate = state.exchangeRate || rate;
  let fromCur, toCur, targetAmt, refTargetAmt;
  if (dir === "USD_TO_SYP") {
    fromCur = "USD"; toCur = "SYP";
    targetAmt = Number((amt * rate).toFixed(2));
    refTargetAmt = Number((amt * refRate).toFixed(2));
  } else {
    fromCur = "SYP"; toCur = "USD";
    targetAmt = Number((amt / rate).toFixed(2));
    refTargetAmt = Number((amt / refRate).toFixed(2));
  }
  const gainLoss = Number((targetAmt - refTargetAmt).toFixed(2));
  const fxList = loadModuleData("fx_history", []);
  fxList.unshift({ id: generateHiddenUuid(), at: new Date().toISOString(), fromCur, toCurrency: toCur, sourceAmt: amt, targetAmt, appliedRate: rate, refRate, gainLoss, note });
  saveModuleData("fx_history", fxList);

  await postTransaction({ tx_type: "expense", amount: amt, currency: fromCur, module_source: "fx_exchange", exchange_rate: rate, description: `تحويل عملة (${fromCur}→${toCur}) بسعر ${fmtNum(rate)} ${note}` });
  await postTransaction({ tx_type: "income", amount: targetAmt, currency: toCur, module_source: "fx_exchange", exchange_rate: rate, description: `استلام تحويل عملة (${fromCur}→${toCur}) | فرق صرف: ${fmtNum(gainLoss)} ${toCur}` });
  state.showFxModal = false;
  showToast(`تم التحويل بنجاح | أثر فروقات الصرف: ${fmtNum(gainLoss)} ${toCur}`);
  render();
}

function addOrUpdatePosProduct(e) {
  e.preventDefault();
  const name = document.getElementById("pos-name").value.trim();
  const sku = document.getElementById("pos-sku").value.trim();
  const warehouseId = document.getElementById("pos-wh").value || "wh-main";
  const cost = perms().canViewCost ? fromMinor(toMinor(document.getElementById("pos-cost").value || 0)) : 0;
  const price = fromMinor(toMinor(document.getElementById("pos-price").value));
  const currency = document.getElementById("pos-currency").value;
  const stock = Math.max(0, Math.floor(Number(document.getElementById("pos-stock").value || 0)));
  const minStock = Math.max(0, Math.floor(Number(document.getElementById("pos-min").value || 2)));
  if (!name || price <= 0) return showToast("أدخل اسم الصنف وسعر البيع", "error");

  const items = loadModuleData("pos_items", []);
  if (state.editingProductId) {
    const idx = items.findIndex(x => x.id === state.editingProductId);
    if (idx !== -1) {
      const before = { ...items[idx] };
      const keepCost = perms().canViewCost ? cost : (items[idx].cost || 0);
      items[idx] = { ...items[idx], name, sku, warehouseId, cost: keepCost, price, currency, stock, minStock, updatedAt: new Date().toISOString() };
      recordLocalAudit("UPDATE_ITEM", "inventory", before, items[idx]);
    }
    state.editingProductId = null; showToast("تم تحديث الصنف");
  } else {
    const hid = generateHiddenUuid();
    const rec = { id: hid, hidden_uuid: hid, warehouseId, name, sku, cost, price, currency, stock, minStock, createdAt: new Date().toISOString() };
    items.unshift(rec);
    recordLocalAudit("CREATE_ITEM", "inventory", null, { name, warehouseId, stock, hidden_uuid: hid });
    showToast("تمت إضافة الصنف برقم ID مخفي ✅");
  }
  saveModuleData("pos_items", items); render();
}
function transferProductWarehouse(pid) {
  const items = loadModuleData("pos_items", []);
  const src = items.find(x => x.id === pid); if (!src) return;
  const whs = getWarehouses().filter(w => w.id !== (src.warehouseId || "wh-main"));
  if (whs.length === 0) return showToast("أضف مستودعاً آخر أولاً", "error");
  const choice = prompt(`اختر رقم المستودع الهدف للتحويل إليه:\n${whs.map((w, i) => `${i + 1}) ${w.name}`).join("\n")}`, "1");
  const targetWh = whs[Number(choice) - 1];
  if (!targetWh) return;
  const qty = Math.floor(Number(prompt(`الكمية المراد تحويلها من (${src.name}) [المتوفر: ${src.stock}]:`, "1")));
  if (!qty || qty <= 0 || qty > Number(src.stock)) return showToast("كمية التحويل غير صالحة", "error");

  src.stock = Number(src.stock) - qty;
  const existingDest = items.find(x => x.name === src.name && (x.warehouseId || "wh-main") === targetWh.id && x.currency === src.currency);
  if (existingDest) existingDest.stock = Number(existingDest.stock) + qty;
  else {
    const hid = generateHiddenUuid();
    items.unshift({ ...src, id: hid, hidden_uuid: hid, warehouseId: targetWh.id, stock: qty, createdAt: new Date().toISOString() });
  }
  saveModuleData("pos_items", items);
  const moves = loadModuleData("stock_movements", []);
  moves.unshift({ id: generateHiddenUuid(), at: new Date().toISOString(), type: "TRANSFER", item: src.name, qty, from: src.warehouseId || "wh-main", to: targetWh.id });
  saveModuleData("stock_movements", moves.slice(0, 200));
  recordLocalAudit("WAREHOUSE_TRANSFER", "inventory", { from: src.warehouseId, qty }, { to: targetWh.id, item: src.name });
  showToast(`تم تحويل ${qty} من ${src.name} إلى ${targetWh.name} ✅`); render();
}
async function recordDamagedProduct(pid) {
  const items = loadModuleData("pos_items", []);
  const it = items.find(x => x.id === pid); if (!it) return;
  const qty = Math.floor(Number(prompt(`كم قطعة تالفة/هالكة من (${it.name})؟ [المتوفر: ${it.stock}]`, "1")));
  if (!qty || qty <= 0 || qty > Number(it.stock)) return showToast("كمية غير صالحة", "error");
  const reason = prompt("سبب التلف (مثال: كسر شاشة أثناء التركيب / منتهي الصلاحية):", "تلف مخزني") || "تلف مخزني";
  it.stock = Number(it.stock) - qty;
  saveModuleData("pos_items", items);
  const loss = fromMinor(toMinor(it.cost || it.price) * BigInt(qty));
  const moves = loadModuleData("stock_movements", []);
  moves.unshift({ id: generateHiddenUuid(), at: new Date().toISOString(), type: "DAMAGED", item: it.name, qty, loss, currency: it.currency, reason });
  saveModuleData("stock_movements", moves.slice(0, 200));
  if (loss > 0 && perms().canPostFinance) {
    await postTransaction({ tx_type: "expense", amount: loss, currency: it.currency, module_source: "inventory_damage", description: `إتلاف مخزون (${it.name} ×${qty}) — ${reason}` });
  } else { showToast(`تم تسجيل إتلاف ${qty} من ${it.name}`); render(); }
}
async function processSalesReturn(pid) {
  const items = loadModuleData("pos_items", []);
  const it = items.find(x => x.id === pid); if (!it) return;
  const qty = Math.floor(Number(prompt(`كم قطعة مرتجعة من الزبون للصنف (${it.name})؟`, "1")));
  if (!qty || qty <= 0) return;
  it.stock = Number(it.stock) + qty;
  saveModuleData("pos_items", items);
  const refund = fromMinor(toMinor(it.price) * BigInt(qty));
  const moves = loadModuleData("stock_movements", []);
  moves.unshift({ id: generateHiddenUuid(), at: new Date().toISOString(), type: "RETURN", item: it.name, qty, refund, currency: it.currency });
  saveModuleData("stock_movements", moves.slice(0, 200));
  if (refund > 0 && perms().canPostFinance) {
    await postTransaction({ tx_type: "expense", amount: refund, currency: it.currency, module_source: "sales_return", description: `مرتجع مبيعات وإعادة للمخزون (${it.name} ×${qty})` });
  } else { showToast(`تم إرجاع ${qty} للمخزون`); render(); }
}

function deletePosProduct(pid) {
  if (!confirm("حذف الصنف من المخزون؟")) return;
  saveModuleData("pos_items", loadModuleData("pos_items", []).filter(x => x.id !== pid));
  if (state.editingProductId === pid) state.editingProductId = null;
  recordLocalAudit("DELETE_ITEM", "inventory", { pid }, null); render();
}
function addToCart(pid) {
  const p = loadModuleData("pos_items", []).find(x => x.id === pid);
  if (!p || Number(p.stock) <= 0) return showToast("نفدت الكمية من المخزون!", "error");
  const ex = state.posCart.find(c => c.id === pid);
  if (ex) { if (ex.qty + 1 > Number(p.stock)) return showToast("تجاوزت الكمية المتوفرة", "error"); ex.qty += 1; }
  else state.posCart.push({ ...p, qty: 1 });
  render();
}
async function checkoutPosCart(mode) {
  if (state.posCart.length === 0) return showToast("السلة فارغة", "error");
  const accId = (document.getElementById("pos-customer") || {}).value || null;
  const items = loadModuleData("pos_items", []);
  const cogsLog = loadModuleData("cogs_ledger", []);
  let usdMinor = 0n, sypMinor = 0n, usdCost = 0n, sypCost = 0n;
  const parts = [];
  for (const c of state.posCart) {
    const q = BigInt(c.qty);
    const lSale = toMinor(c.price) * q;
    const lCost = toMinor(c.cost || 0) * q;
    if (c.currency === "USD") { usdMinor += lSale; usdCost += lCost; } else { sypMinor += lSale; sypCost += lCost; }
    parts.push(`${c.name} ×${c.qty}`);
    const p = items.find(i => i.id === c.id);
    if (p) p.stock = Math.max(0, Number(p.stock) - c.qty);
  }
  saveModuleData("pos_items", items);
  if (usdCost > 0n) cogsLog.unshift({ id: generateHiddenUuid(), at: new Date().toISOString(), cost: fromMinor(usdCost), currency: "USD", desc: parts.join("، ") });
  if (sypCost > 0n) cogsLog.unshift({ id: generateHiddenUuid(), at: new Date().toISOString(), cost: fromMinor(sypCost), currency: "SYP", desc: parts.join("، ") });
  saveModuleData("cogs_ledger", cogsLog.slice(0, 500));

  const txType = mode === "credit" ? "debt_out" : "income";
  const lbl = mode === "credit" ? "آجل" : "نقداً";
  if (usdMinor > 0n) await postTransaction({ tx_type: txType, amount: fromMinor(usdMinor), currency: "USD", account_id: accId, module_source: "pos_inventory", description: `فاتورة (${lbl}): ${parts.join("، ")}` });
  if (sypMinor > 0n) await postTransaction({ tx_type: txType, amount: fromMinor(sypMinor), currency: "SYP", account_id: accId, module_source: "pos_inventory", description: `فاتورة (${lbl}): ${parts.join("، ")}` });
  state.posCart = []; render();
}

function addRepairTicket(e) {
  e.preventDefault();
  const customer = document.getElementById("rep-cust").value.trim();
  const phone = document.getElementById("rep-phone").value.trim();
  const device = document.getElementById("rep-device").value.trim();
  const imei = document.getElementById("rep-imei").value.trim();
  const issue = document.getElementById("rep-issue").value.trim();
  const partId = document.getElementById("rep-part-id").value;
  let partsCost = fromMinor(toMinor(document.getElementById("rep-parts").value || 0));
  const cost = fromMinor(toMinor(document.getElementById("rep-cost").value));
  const currency = document.getElementById("rep-cur").value;
  const warrantyDays = Number(document.getElementById("rep-warranty").value || 0);
  if (!customer || !device || cost <= 0) return showToast("أكمل بيانات الجهاز والأجرة", "error");

  let partName = "";
  if (partId) {
    const items = loadModuleData("pos_items", []);
    const part = items.find(x => x.id === partId);
    if (part && Number(part.stock) > 0) {
      part.stock = Number(part.stock) - 1;
      partName = part.name;
      if (partsCost === 0 && part.cost) partsCost = Number(part.cost);
      saveModuleData("pos_items", items);
    }
  }
  const list = loadModuleData("repairs", []);
  const hid = generateHiddenUuid();
  list.unshift({ id: hid, hidden_uuid: hid, customer, phone, device, imei, issue, partName, partsCost, cost, currency, warrantyDays, status: "قيد الصيانة", created_at: new Date().toISOString() });
  saveModuleData("repairs", list);
  recordLocalAudit("CREATE_REPAIR", "repairs", null, { device, customer, partName });
  showToast(partName ? `تم تسجيل الجهاز وخصم قطعة (${partName}) من المخزون ✅` : "تم تسجيل تذكرة الصيانة ✅");
  render();
}
async function deliverRepairTicket(rid) {
  const list = loadModuleData("repairs", []);

  if (!t || t.status === "تم التسليم") return;
  t.status = "تم التسليم"; saveModuleData("repairs", list);
  if (t.partsCost > 0) {
    const cogsLog = loadModuleData("cogs_ledger", []);
    cogsLog.unshift({ id: generateHiddenUuid(), at: new Date().toISOString(), cost: t.partsCost, currency: t.currency, desc: `قطع صيانة: ${t.device}` });
    saveModuleData("cogs_ledger", cogsLog.slice(0, 500));
  }
  if (perms().canPostFinance) {
    await postTransaction({ tx_type: "income", amount: t.cost, currency: t.currency, module_source: "telecom_maintenance", description: `تسليم صيانة ${t.device} (${t.customer}) ${t.warrantyDays ? '| ضمان '+t.warrantyDays+' يوم' : ''}` });

async function toggleTenantModule(tid, mk) {
  const t = state.tenants.find(x => x.id === tid); if (!t) return;
  const upd = { ...(t.enabled_modules||{}), [mk]: !(t.enabled_modules&&t.enabled_modules[mk]) };
  if (!state.isDemo) await sb.from("tenants").update({ enabled_modules: upd }).eq("id", tid);
  t.enabled_modules = upd; render();
}
async function extendTenant(tid, days) {
  const t = state.tenants.find(x => x.id === tid); if (!t) return;
  const newExp = new Date(Math.max(Date.now(), new Date(t.expires_at).getTime()) + days*86400000).toISOString();
  if (!state.isDemo) await sb.from("tenants").update({ expires_at: newExp, is_active: true }).eq("id", tid);
  t.expires_at = newExp; t.is_active = true; showToast(`تم التمديد +${days} يوم`); render();
}
async function toggleTenantActive(tid) {
  const t = state.tenants.find(x => x.id === tid); if (!t) return;

}

        <div class="subcard" style="margin-top:6px;font-size:11.5px">
          <b>${fmtDate(r.closedAt)}</b> (${escapeHtml(r.closedBy||"")}) | فرق USD: <b style="color:${r.diffUsd===0?'#10b981':'#f87171'}">${fmtNum(r.diffUsd)}$</b> | فرق SYP: <b style="color:${r.diffSyp===0?'#10b981':'#f87171'}">${fmtNum(r.diffSyp)}</b>

    <div class="wrap">

        ${p.canPostFinance ? `<button class="tab ${state.tenantTab==="ledger"?"active":""}" onclick="state.tenantTab='ledger';render()">📒 دفتر اليومية</button>` : ""}
        ${p.canViewIfrs ? `<button class="tab ${state.tenantTab==="ifrs"?"active":""}" onclick="state.tenantTab='ifrs';render()">📈 التقارير المالية IFRS</button>` : ""}

function renderPosTab() {
  const whs = getWarehouses();

  const items = state.selectedWarehouse === "ALL" ? allItems : allItems.filter(i => (i.warehouseId || "wh-main") === state.selectedWarehouse);
  const editing = state.editingProductId ? allItems.find(x => x.id === state.editingProductId) : null;
  const canCost = perms().canViewCost;
  let cartUsd = 0n, cartSyp = 0n;
  for (const c of state.posCart) { const l = toMinor(c.price)*BigInt(c.qty); if (c.currency==="USD") cartUsd += l; else cartSyp += l; }

  return `
    <div class="card row-between">
      <div class="row">
        <b>🏬 المستودع:</b>
        <select class="inp" style="width:auto" onchange="state.selectedWarehouse=this.value;render()">

          ${whs.map(w => `<option value="${w.id}" ${state.selectedWarehouse===w.id?"selected":""}>${escapeHtml(w.name)}</option>`).join("")}
        </select>

        <div class="grid-2">
          <select id="pos-wh" class="inp">${whs.map(w => `<option value="${w.id}" ${editing&&(editing.warehouseId||"wh-main")===w.id?"selected":""}>${escapeHtml(w.name)}</option>`).join("")}</select>

        <div class="grid-2">
          ${canCost ? `<input id="pos-cost" type="number" step="0.01" placeholder="سعر التكلفة (جملة)" value="${editing?editing.cost:""}" class="inp" required />` : `<input id="pos-cost" type="hidden" value="0" />`}

        </div>
        <div class="grid-3">
          <select id="pos-currency" class="inp"><option value="USD" ${editing&&editing.currency==="USD"?"selected":""}>USD</option><option value="SYP" ${editing&&editing.currency==="SYP"?"selected":""}>ل.س</option></select>

        </div>
        <div class="row">
          <button type="submit" class="btn btn-prim" style="flex:1">${editing ? "حفظ التعديل" : "إضافة للمخزون"}</button>
          ${editing ? `<button type="button" class="btn btn-sec" onclick="state.editingProductId=null;render()">إلغاء</button>` : ""}
        </div>
      </form>

      <div class="card" style="display:grid;gap:8px;align-content:start">

        <b>🧾 فاتورة المبيعات (POS)</b>

          <span>${escapeHtml(c.name)} ×${c.qty}</span>
          <div class="row"><b>${fmtNum(c.price*c.qty)} ${c.currency}</b><button class="btn btn-dang" style="padding:2px 6px" onclick="state.posCart=state.posCart.filter(x=>x.id!=='${c.id}');render()">✕</button></div>
        </div>`).join("") || `<div class="muted" style="text-align:center;padding:16px">السلة فارغة</div>`}
        <div class="subcard"><div>دولار: <b style="color:var(--primary)">${fmtMinor(cartUsd)} $</b></div><div>ليرة: <b style="color:var(--accent)">${fmtMinor(cartSyp)} ل.س</b></div></div>
        <select id="pos-customer" class="inp"><option value="">زبون نقدي</option>${state.accounts.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("")}</select>

      </div>
    </div>`;

function render() {
  const activeEl = document.activeElement;
  const focusId = activeEl && activeEl.id ? activeEl.id : null;
  const selStart = activeEl && typeof activeEl.selectionStart === "number" ? activeEl.selectionStart : null;
  const root = document.getElementById("app");

  if (state.loading) { root.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center"><b>جارٍ تحميل Sama Business Enterprise v1.1...</b></div>`; return; }
  if (state.isLocked && localStorage.getItem(PIN_KEY)) { root.innerHTML = renderPinLockScreen(); return; }
  if (!state.user || !state.profile) root.innerHTML = renderAuthScreen();
  else if (state.profile.role === "super_admin") root.innerHTML = renderSuperAdmin();
  else root.innerHTML = renderTenantDashboard();

  if (focusId) {
    const restored = document.getElementById(focusId);
    if (restored) {
      restored.focus();
      if (selStart !== null && typeof restored.setSelectionRange === "function") {
        try { restored.setSelectionRange(selStart, selStart); } catch (_) {}
      }
    }
  }
}

window.addEventListener("online", () => { state.online = true; render(); syncOfflineQueue(); });
window.addEventListener("offline", () => { state.online = false; render(); });
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
bootstrapSession();
</script>
